name: Automated Wellness Product Feed Update

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Product Feed Updater
        run: node scripts/update_wellness_deals.js

      - name: Commit & Push Updated Feed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add wellness_deals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Wellness Product Feed [skip ci]" && git push)
